# Treasure Trove's generator: builds catalog/catalog.json, the painting catalog
# the watchface (bundled into the app) and the settings page (site/) use. There
# is no server: pictures come straight from the Rijksmuseum's IIIF server.
#
#   docker compose run --rm generator        # monthly; resumable; polite
#
# Works in ./data (catalog.sqlite + master images, not in git) and writes
# catalog/catalog.json, catalog/featured.json and catalog/paintings.jsonl.
# Then: node scripts/bundle-catalog.mjs (see docs/GENERATOR.md).

services:
  generator:
    build: ./generator
    image: treasure-trove-generator:latest
    restart: "no"
    command: ["treasure-trove-generator", "--export", "/catalog/paintings.jsonl"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-1}
      CONTACT: ${CONTACT:-}
      REFRESH_DAYS: ${REFRESH_DAYS:-25}
      SAFE_CROP_PX: ${SAFE_CROP_PX:-20}
      PD_FALLBACK_YEAR: ${PD_FALLBACK_YEAR:-1850}
      POOL_MAX_PAGES: ${POOL_MAX_PAGES:-80}
      SOURCE_SIZE: ${SOURCE_SIZE:-1200}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./catalog:/catalog
