# Treasure Trove: a generator that pre-renders everything, and a server that
# only serves those files.
#
#   Generate (monthly; resumable; polite):  docker compose run --rm generator
#   Serve, LAN only:                         docker compose up -d --build
#   Serve + public HTTPS URL:                docker compose --profile tailscale up -d --build
#
# Both use ./data (catalog.sqlite + art/, not in git). The generator also writes
# catalog/paintings.jsonl (metadata, in git). The tailscale profile publishes the
# server through Tailscale Funnel at https://<TS_HOSTNAME>.<your-tailnet>.ts.net.
# See docs/GENERATOR.md and docs/DEPLOY.md.

services:
  server:
    build: ./server
    image: treasure-trove:latest
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PALETTE_REFERENCE: ${PALETTE_REFERENCE:-defined}
    volumes:
      - ${DATA_DIR:-./data}:/data:ro

  generator:
    profiles: ["generate"]
    image: treasure-trove:latest
    build: ./server
    restart: "no"
    # The image's HEALTHCHECK probes the web server, which the generator doesn't run.
    healthcheck:
      disable: true
    command: ["treasure-trove-generator", "--export", "/catalog/paintings.jsonl", "--featured", "/catalog/featured.json"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-1}
      CONTACT: ${CONTACT:-}
      REFRESH_DAYS: ${REFRESH_DAYS:-25}
      SAFE_CROP_PX: ${SAFE_CROP_PX:-20}
      PD_FALLBACK_YEAR: ${PD_FALLBACK_YEAR:-1850}
      POOL_MAX_PAGES: ${POOL_MAX_PAGES:-80}
      WEBP_QUALITY: ${WEBP_QUALITY:-90}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./catalog:/catalog

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-treasure-trove}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun needed, which keeps this working
      # inside an unprivileged Proxmox LXC container.
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - server

volumes:
  ts-state:
